
[environ]
# Pseudopotential file path
potcar_path = ~/POT_GGA_PAW_PBE_54
#vasp execution path
vasp_path = vasp_std
#vasp ncl execution path
vasp_ncl_path = vasp_ncl
#abacus execution path
abacus_path = abacus
#mpirun execution path
mpirun_path = mpirun
#nep execution path
nep_path = nep
#gpumd execution path
gpumd_path = gpumd
#Quantum Espresso execution path
qe_path = pw.x
#Quantum Espresso pseudopotential path
qe_pp_path = ~/SSSP_efficiency_pseudos
#NEP89 path
nep89_path = ~/nep89_20250409.txt

[potcar]
#You can set the pseudopotential file version yourself
#If not set, the pseudopotential file version recommended by the VASP official website will be used
#eg:Ag=Ag_sv
H=H

[magmom]
Fe = 5.0
Ni = 5.0
Co = 5.0